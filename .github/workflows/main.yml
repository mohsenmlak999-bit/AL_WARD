
name: Build AL WARD APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"
  BUILDOZER_WARN_ON_ROOT: "0"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK and accept licenses
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          log-accepted-android-sdk-licenses: "false"
          packages: "platform-tools"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool \
            pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libltdl-dev libsqlite3-dev \
            libjpeg-dev libfreetype6-dev \
            gettext autopoint

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.33

      - name: Prepare buildozer.spec
        run: |
          buildozer init

          sed -i 's/^title = .*/title = AL WARD/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = alward/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = com.alward.chat/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,jpeg,kv,atlas/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,requests,pillow/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 23/' buildozer.spec
          sed -i 's/^android.archs = .*/android.archs = arm64-v8a,armeabi-v7a/' buildozer.spec

          sed -i 's/^# *android.accept_sdk_license =.*/android.accept_sdk_license = True/' buildozer.spec

          echo "===== buildozer.spec prepared ====="
          cat buildozer.spec

      - name: Install Android SDK Build Tools 37
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;37.0.0"

      - name: Build AL WARD APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-WARD-APK
          path: bin/*.apk
          if-no-files-found: error
