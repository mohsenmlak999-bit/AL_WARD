
name: Build AL WARD APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            build-essential

      - name: Install Buildozer
        run: |
          pip3 install --user --upgrade buildozer cython==0.29.36

      - name: Create buildozer.spec
        run: |
          ~/.local/bin/buildozer init
          sed -i 's/^title = .*/title = AL WARD/' buildozer.spec
          sed -i 's/^package.name = .*/package.name = alward/' buildozer.spec
          sed -i 's/^package.domain = .*/package.domain = com.alward.chat/' buildozer.spec
          sed -i 's/^source.include_exts = .*/source.include_exts = py,png,jpg,kv,atlas/' buildozer.spec
          sed -i 's/^requirements = .*/requirements = python3,kivy,requests,pillow/' buildozer.spec
          sed -i 's/^orientation = .*/orientation = portrait/' buildozer.spec
          sed -i 's/^android.permissions = .*/android.permissions = INTERNET,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE,RECORD_AUDIO,CAMERA/' buildozer.spec
          sed -i 's/^android.api = .*/android.api = 35/' buildozer.spec
          sed -i 's/^android.minapi = .*/android.minapi = 23/' buildozer.spec

      - name: Build APK
        run: |
          ~/.local/bin/buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AL-WARD-APK
          path: bin/*.apk
          retention-days: 7
